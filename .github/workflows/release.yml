name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    uses: dekopon-agents/provider-workflows/.github/workflows/release.yml@a0177e7fbaef1fce8e17b74e0e53460561d14cde # settings WIT pin
    permissions:
      contents: write
      id-token: write
      attestations: write
      packages: write
