name: Cut release

on:
  workflow_dispatch:
    inputs:
      version:
        description: The version to release, without the v (1.2.3 or 1.2.3-rc.1)
        type: string
        required: true

jobs:
  cut:
    uses: dekopon-agents/provider-workflows/.github/workflows/cut-release.yml@a0177e7fbaef1fce8e17b74e0e53460561d14cde # settings WIT pin
    permissions:
      contents: write
    with:
      version: ${{ inputs.version }}
    secrets: inherit
